<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>StudyMate AI 🎓</h1>

    <p>Your AI-powered study companion.</p>

    <button id="startButton">Start Learning</button>

    <div id="studyArea" style="display: none;">

        <!-- SUBJECT SECTION -->

        <h2>What do you want to study?</h2>

        <input
            id="subjectInput"
            type="text"
            placeholder="Enter a subject..."
        >

        <button id="continueButton">Continue</button>

        <p id="message"></p>


        <!-- NOTES SECTION -->

        <h2>Quick Notes 📚</h2>

        <textarea
            id="notesInput"
            placeholder="Write your study notes here..."
        ></textarea>

        <br>

        <button id="saveNotesButton">Save Notes</button>

        <p id="notesMessage"></p>


        <!-- QUIZ SECTION -->

        <h2>Quick Quiz 🧠</h2>

        <button id="quizButton">Start Quiz</button>

        <p id="quizQuestion"></p>

        <div id="answerButtons"></div>

        <p id="quizResult"></p>


        <!-- AI STUDY ASSISTANT -->

        <h2>AI Study Assistant 🤖</h2>

        <textarea
            id="aiQuestion"
            placeholder="Ask me anything about your subject..."
        ></textarea>

        <br>

        <button id="askAIButton">Ask AI</button>

        <p id="aiAnswer"></p>

    </div>


    <script>

        // START LEARNING

        document.getElementById("startButton").onclick = function() {

            document.getElementById("studyArea").style.display = "block";

            document.getElementById("startButton").style.display = "none";

        };


        // SUBJECT

        document.getElementById("continueButton").onclick = function() {

            const subject =
                document.getElementById("subjectInput").value.trim();

            if (subject === "") {

                document.getElementById("message").textContent =
                    "Please enter a subject!";

            } else {

                document.getElementById("message").textContent =
                    "Great! Let's learn " + subject + " 📚";

            }

        };


        // SAVE NOTES

        document.getElementById("saveNotesButton").onclick = function() {

            const notes =
                document.getElementById("notesInput").value.trim();

            if (notes === "") {

                document.getElementById("notesMessage").textContent =
                    "Please write some notes!";

            } else {

                localStorage.setItem("studyNotes", notes);

                document.getElementById("notesMessage").textContent =
                    "Notes saved! ✅";

            }

        };


        // QUIZ QUESTIONS

        const questions = [

            {
                question: "What process do plants use to make food?",
                answers: [
                    "Photosynthesis",
                    "Respiration",
                    "Digestion"
                ],
                correct: "Photosynthesis"
            },

            {
                question: "What is the capital of India?",
                answers: [
                    "Mumbai",
                    "New Delhi",
                    "Kolkata"
                ],
                correct: "New Delhi"
            },

            {
                question: "How many planets are in our Solar System?",
                answers: [
                    "7",
                    "8",
                    "9"
                ],
                correct: "8"
            }

        ];


        // START QUIZ

        document.getElementById("quizButton").onclick = function() {

            const randomIndex =
                Math.floor(Math.random() * questions.length);

            const question =
                questions[randomIndex];

            document.getElementById("quizQuestion").textContent =
                question.question;

            document.getElementById("quizResult").textContent = "";

            const answerArea =
                document.getElementById("answerButtons");

            answerArea.innerHTML = "";


            question.answers.forEach(function(answer) {

                const button =
                    document.createElement("button");

                button.textContent = answer;

                button.onclick = function() {

                    if (answer === question.correct) {

                        document.getElementById("quizResult").textContent =
                            "Correct! 🎉";

                    } else {

                        document.getElementById("quizResult").textContent =
                            "Not quite! Try again. ❌";

                    }

                };

                answerArea.appendChild(button);

            });

        };


        // AI STUDY ASSISTANT

        document.getElementById("askAIButton").onclick = async function() {

            const question =
                document.getElementById("aiQuestion").value.trim();

            const subject =
                document.getElementById("subjectInput").value.trim();

            const answerBox =
                document.getElementById("aiAnswer");

            if (question === "") {

                answerBox.textContent =
                    "Please enter a question!";

                return;

            }


            answerBox.textContent =
                "AI is thinking... 🤖";


            try {

                const response = await fetch(
                    "/.netlify/functions/ask-ai",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question: question,
                            subject: subject
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    answerBox.textContent =
                        data.error || "Something went wrong.";

                    return;

                }


                answerBox.textContent =
                    data.answer || "I couldn't generate an answer.";


            } catch (error) {

                answerBox.textContent =
                    "Could not connect to the AI. Please try again.";

            }

        };

    </script>

</body>

</html>
