<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>StudyMate AI 🎓</h1>

    <p>Your AI-powered study companion.</p>

    <button id="startButton">Start Learning</button>

    <div id="studyArea" style="display: none;">

        <h2>What do you want to study?</h2>

        <input
            id="subjectInput"
            type="text"
            placeholder="Enter a subject..."
        >

        <button id="continueButton">Continue</button>

        <p id="message"></p>

        <h2>Quick Notes 📚</h2>

        <textarea
            id="notesInput"
            placeholder="Write your study notes here..."
        ></textarea>

        <br>

        <button id="saveNotesButton">Save Notes</button>

        <p id="notesMessage"></p>
        <h2>Quick Quiz 🧠</h2>

        <button id="quizButton">Start Quiz</button>

        <p id="quizQuestion"></p>

        <button id="answerButton" style="display: none;">
        Photosynthesis
        </button>

        <p id="quizResult"></p>

        </div>

    <!-- JavaScript starts here -->
    <script>

        document.getElementById("startButton").onclick = function() {
            document.getElementById("studyArea").style.display = "block";
            document.getElementById("startButton").style.display = "none";
        };

        document.getElementById("continueButton").onclick = function() {

            const subject =
                document.getElementById("subjectInput").value;

            if (subject === "") {

                document.getElementById("message").textContent =
                    "Please enter a subject!";

            } else {

                document.getElementById("message").textContent =
                    "Great! Let's learn " + subject + " 📚";

            }
        };

        document.getElementById("saveNotesButton").onclick = function() {

            const notes =
                document.getElementById("notesInput").value;

            if (notes === "") {

                document.getElementById("notesMessage").textContent =
                    "Please write some notes!";

            } else {

                localStorage.setItem("studyNotes", notes);

                document.getElementById("notesMessage").textContent =
                    "Notes saved! ✅";

            }
        };
        

        const questions = [
        "What process do plants use to make food?",
        "What is the capital of India?",
        "How many planets are in our Solar System?"
        ];

        const randomQuestion =
            questions[Math.floor(Math.random() * questions.length)];

        document.getElementById("quizQuestion").textContent =
            randomQuestion;

        document.getElementById("answerButton").style.display =
            "inline-block";
};

        document.getElementById("answerButton").onclick = function() {

        document.getElementById("quizResult").textContent =
        "Correct! 🎉";
        };

    </script>

</body>
</html>
